name: Build Image

on:
  push:
    tags:
      - "v*"   # e.g. v0.2.1

permissions:
  contents: write
  packages: write

jobs:
  image-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for tagging

      # 🔹 Ensure the tools module has its own semver tag
      - name: Create tools module tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Root tag: ${VERSION}"
          
          cd tools
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tools tag v${VERSION} already exists. Skipping."
          else
            echo "Creating tools tag v${VERSION}"
            git tag v${VERSION}
            git push origin v${VERSION}
          fi

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build and Push Multi-Platform Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./tools
          file: ./tools/images/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x
          push: true
          build-args: |
            FABRIC_X_VERSION=v${{ env.VERSION }}
            REPO_PATH=github.com/anushka159-a/fabric-x/tools
          tags: |
            docker.io/anushka12/fabric-x-tools:latest
            docker.io/anushka12/fabric-x-tools:${{ env.VERSION }}
