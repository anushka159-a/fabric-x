name: Build Image

on:
  push:
    tags:
      - "v*"   # root version tags (e.g. v0.0.6)

permissions:
  contents: write   # needed to push tags
  packages: write   # needed for GHCR/Docker

jobs:
  image-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ensure tags are available

      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build and Push Multi-Platform Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./tools
          file: ./tools/images/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x
          push: true
          build-args: |
            FABRIC_X_VERSION=${{ github.ref_name }}
            REPO_PATH=github.com/hyperledger/fabric-x/tools
          tags: |
            docker.io/anushka12/fabric-x-tools:latest
            docker.io/anushka12/fabric-x-tools:${{ env.VERSION }}
